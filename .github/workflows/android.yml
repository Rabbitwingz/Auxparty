name: Android app

on:
  push:
    paths:
      - "android/**"
      - "design/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write # publishing releases (APK and screenshots)

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
      IS_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper is committed; this installs a pinned Gradle instead.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      # One debug test pass runs the unit tests and renders the screenshot tests
      # (Robolectric + Roborazzi) to app/build/outputs/roborazzi.
      - name: Unit tests and screenshots
        run: |
          set -o pipefail
          gradle --no-daemon recordRoborazziDebug 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      # Every push, any branch: replace the screenshots in the public
      # `ui-screenshots` pre-release, so a design review needs no local build.
      - name: Publish screenshots
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shots=$(ls app/build/outputs/roborazzi/*.png 2>/dev/null || true)
          [ -n "$shots" ] || { echo "::warning::No screenshots were rendered"; exit 0; }
          tag=ui-screenshots
          gh release view "$tag" > /dev/null 2>&1 || \
            gh release create "$tag" --prerelease --title "UI screenshots" \
              --notes "Rendered by CI from the most recent push. Not an app release."
          for asset in $(gh release view "$tag" --json assets -q '.assets[].name'); do
            gh release delete-asset "$tag" "$asset" -y
          done
          printf 'ref=%s\nsha=%s\nrun=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/build-info.txt"
          gh release upload "$tag" $shots "$RUNNER_TEMP/build-info.txt" --clobber

      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          # Fail here, clearly, rather than deep inside Gradle.
          keytool -list -storetype pkcs12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$SIGNING_STORE_PASSWORD" > /dev/null
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Warn about unsigned build
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::No signing key secrets configured. The APK is built and tested but NOT published, because an install signed with a throwaway key blocks every later update."

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/auxparty.apk"
          echo "::notice title=APK size::$(stat -c %s "$RUNNER_TEMP/auxparty.apk") bytes"

      # Compiler and test errors as a single annotation. Annotations are readable
      # through the public API, so failures can be diagnosed without raw logs.
      - name: Summarise failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/gradle.log" ] || exit 0
          summary=$( {
            grep -E '^e: ' "$RUNNER_TEMP/gradle.log"
            grep -E -A3 'FAILED$|expected:<|Exception:' "$RUNNER_TEMP/gradle.log"
            grep -A6 '^\* What went wrong' "$RUNNER_TEMP/gradle.log"
          } | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | awk '!seen[$0]++' | head -80 )
          [ -n "$summary" ] || summary=$(tail -60 "$RUNNER_TEMP/gradle.log")
          # Newlines must be %0A-encoded to survive inside one annotation.
          encoded=$(printf '%s' "$summary" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle failure::$encoded"

      - uses: actions/upload-artifact@v7
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          name: auxparty-apk
          path: ${{ runner.temp }}/auxparty.apk

      # Branch builds go to a separate pre-release so a revamp can be tried on a
      # phone before merging. Same signing key, so it installs over the main build.
      - name: Publish branch preview
        if: env.HAS_SIGNING_KEY == 'true' && env.IS_MAIN != 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "$RUNNER_TEMP/auxparty.apk" "$RUNNER_TEMP/auxparty-preview.apk"
          gh release view android-preview > /dev/null 2>&1 || \
            gh release create android-preview --prerelease \
              --title "Android app (branch preview)" \
              --notes "Built from a development branch. Installs over the regular app."
          gh release upload android-preview "$RUNNER_TEMP/auxparty-preview.apk" --clobber

      # A fixed download URL that always points at the newest build from main.
      - name: Publish to rolling release
        if: env.HAS_SIGNING_KEY == 'true' && env.IS_MAIN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view android-latest > /dev/null 2>&1 || \
            gh release create android-latest --prerelease \
              --title "Android app (latest build)" \
              --notes "Built automatically from main. Download auxparty.apk on your phone to install or update."
          gh release edit android-latest --notes "Built automatically from main. Download auxparty.apk on your phone to install or update."
          gh release upload android-latest "$RUNNER_TEMP/auxparty.apk" --clobber
          # The asset was called music-remote.apk before the Auxparty rename.
          gh release delete-asset android-latest music-remote.apk -y 2>/dev/null || true
